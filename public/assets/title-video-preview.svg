<svg xmlns="http://www.w3.org/2000/svg" width="640" height="86" viewBox="0 0 640 86" role="img" aria-label="Video preview — the web-robot task panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1224"/>
      <stop offset="1" stop-color="#141b38"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="0.7" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#7dd3fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="84" rx="16" fill="url(#bg)" stroke="#2b365d" stroke-width="1.5"/>
  <circle cx="46" cy="43" r="17" fill="none" stroke="#e879f9" stroke-width="2.5" opacity="0.9">
    <animate attributeName="r" values="15;18;15" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M42 35 L54 43 L42 51 Z" fill="#e879f9"/>
  <text x="80" y="38" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="url(#shimmer)" letter-spacing="1">VIDEO PREVIEW</text>
  <text x="80" y="64" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa7d0" letter-spacing="0.5">the task panel — chat with your agent</text>
</svg>
