<svg xmlns="http://www.w3.org/2000/svg" width="430" height="52" viewBox="0 0 430 52" role="img" aria-label="Video preview">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#bf3989"/>
